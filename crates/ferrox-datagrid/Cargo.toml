[package]
name = "ferrox-datagrid"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Server-side pagination, sorting, and filtering query parameter parsers for AG-Grid, MUI X, and TanStack Table."
[features]
default = ["seaorm", "aggrid", "mui", "tanstack"]
seaorm = ["dep:sea-orm"]
mongo = ["dep:mongodb", "dep:bson"]
aggrid = []
mui = []
tanstack = []
graphql = ["dep:async-graphql"]

[dependencies]
ferrox-errors = { version = "0.1.0", path = "../ferrox-errors"  }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional Translators
sea-orm = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
bson = { workspace = true, optional = true }
async-graphql = { workspace = true, optional = true }

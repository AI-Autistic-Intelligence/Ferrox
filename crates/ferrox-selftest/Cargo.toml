[package]
name = "ferrox-selftest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "OWASP Web Security Testing Guide (WSTG) automated self-test pipeline, vulnerability dictionary, and compliance report exporter for Ferrox."
readme = "README.md"
keywords = ["owasp", "wstg", "security", "auditing", "testing"]
categories = ["development-tools::testing", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
ferrox-errors = { version = "0.7.0", path = "../ferrox-errors" }
ferrox-security = { version = "0.7.0", path = "../ferrox-security" }
secrecy = "0.8"
time = { workspace = true }
axum = "0.7"

tower = { version = "0.4", features = ["util"] }

[dev-dependencies]
tower-http = { version = "0.6", features = ["set-header"] }


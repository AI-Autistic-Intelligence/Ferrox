[package]
name = "ferrox-sentinel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "AI/ML Security Analytics & Threat Detection Engine for Ferrox Enterprise backends (Entropy, Feature Hashing, MinHash LSH, Velocity Z-Score, Isolation Anomaly Scoring)."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
rand = "0.8"
axum = "0.8"
tower = { version = "0.4", features = ["util"] }
ferrox-errors = { version = "0.5.0", path = "../ferrox-errors" }
ferrox-security = { version = "0.5.0", path = "../ferrox-security" }
sha2 = "0.10"

[features]
default = []
founder-suite = []

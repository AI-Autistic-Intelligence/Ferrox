[package]
name = "cargo-ferrox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Official Command Line Interface (cargo ferrox) for project scaffolding, local dev-server, DDD compliance checks, and TDD quality gates."

[lib]
name = "cargo_ferrox"
path = "src/lib.rs"

[[bin]]
name = "cargo-ferrox"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
inquire = "0.6"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.4", features = ["v4"] }
sys-locale = "0.3"
chrono = "0.4"
ferrox-sentinel = { version = "0.8.1", path = "../ferrox-sentinel", features = ["founder-suite"] }

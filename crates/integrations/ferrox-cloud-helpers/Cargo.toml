[package]
name = "ferrox-cloud-helpers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Cloud provider SDK helpers for AWS Secrets Manager, GCP Secret Manager, and Azure Key Vault."
[dependencies]
aws-config = "1.1"
aws-sdk-secretsmanager = "1.21"
aws-sdk-s3 = "1.21"
google-cloud-storage = "0.13"
google-cloud-auth = "0.11"
google-cloud-token = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
base64 = "0.22"
tokio = { workspace = true, features = ["full"] }
ferrox-errors = { version = "0.8.0", path = "../../ferrox-errors"  }

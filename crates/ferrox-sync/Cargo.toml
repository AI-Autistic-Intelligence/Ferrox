[package]
name = "ferrox-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ferrox-errors = { path = "../ferrox-errors" }
ferrox-database-redis = { path = "../database/ferrox-database-redis" }
async-trait = "0.1"

[package]
name = "ferrox-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Distributed locking and synchronization mechanisms backed by Redis Redlock and SQL advisory locks."
[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ferrox-errors = { version = "0.1.0", path = "../ferrox-errors"  }
ferrox-database-redis = { version = "0.1.0", path = "../database/ferrox-database-redis"  }
async-trait = "0.1"

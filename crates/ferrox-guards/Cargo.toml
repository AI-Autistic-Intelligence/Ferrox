[package]
name = "ferrox-guards"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Declarative role-based access control (RBAC) route extractors, zero-width evasion sanitizers, and session replay guards for Axum."
readme = "README.md"
keywords = ["security", "axum", "middleware", "rbac", "owasp"]
categories = ["web-programming::http-server", "cryptography"]
[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
ferrox-security = { version = "0.7.0", path = "../ferrox-security"  }
ferrox-errors = { version = "0.7.0", path = "../ferrox-errors"  }
async-trait = "0.1"
sha2 = "0.10"

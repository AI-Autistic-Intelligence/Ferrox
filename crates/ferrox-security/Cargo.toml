[package]
name = "ferrox-security"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "PASETO v4 token translation engine, JWT claim extractors, and role-based authentication primitives."
[dependencies]
secrecy = "0.8"
argon2 = "0.5"
pasetors = "0.6"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v7"] }
rand = "0.8"
hex = "0.4"
serde_json = "1.0"
time = { workspace = true }
ferrox-errors = { version = "0.1.0", path = "../ferrox-errors"  }
axum = { version = "0.7" }

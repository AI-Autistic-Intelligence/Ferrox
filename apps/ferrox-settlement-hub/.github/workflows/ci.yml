name: Ferrox CI & Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo Format
        run: cargo fmt -- --check
      - name: Cargo Clippy
        run: cargo clippy -- -D warnings
      - name: Run Test Suite
        run: cargo test --all

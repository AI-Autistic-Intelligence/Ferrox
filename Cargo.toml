[workspace]
members = [
    "crates/yalc-app",
    "crates/yalc-errors",
    "crates/yalc-logger",
    "crates/yalc-crud-gen",
    "crates/yalc-graphql",
    "crates/yalc-events",
    "crates/yalc-utils",
    "crates/yalc-types",
    "crates/yalc-security",
    "crates/yalc-metrics",
    "crates/database/yalc-database-core",
    "crates/database/yalc-database-seaorm",
    "crates/database/yalc-database-mongo",
    "crates/database/yalc-database-redis",
    "crates/ag-grid/yalc-ag-grid-core",
    "crates/ag-grid/yalc-ag-grid-seaorm",
    "crates/ag-grid/yalc-ag-grid-mongo"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
sea-orm = { version = "1.0" }
async-graphql = "7.0"
time = { version = "0.3", features = ["serde", "formatting", "macros"] }

[workspace.lints.clippy]
pedantic = "warn"
unwrap_used = "deny"

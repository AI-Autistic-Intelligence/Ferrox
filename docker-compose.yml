version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: yalc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: yalc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/security/init_postgres_least_privilege.sql:/docker-entrypoint-initdb.d/init_postgres_least_privilege.sql

  mongo:
    image: mongo:6-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root_password
      MONGO_INITDB_DATABASE: yalc_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/security/init_mongo_least_privilege.js:/docker-entrypoint-initdb.d/init_mongo_least_privilege.js

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      MEILI_MASTER_KEY: "masterKey"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  mongo_data:
  meili_data:
  qdrant_data:
